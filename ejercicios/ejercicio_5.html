<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5</title>
</head>
<body>
    <p id="texto">Este es un texto de prueba.</p>

    <label>Negrita:</label>
    <select id="negrita" onchange="cambiar()">
        <option value="normal">No</option>
        <option value="bold">Sí</option>
    </select>

    <label>Cursiva:</label>
    <select id="cursiva" onchange="cambiar()">
        <option value="normal">No</option>
        <option value="italic">Sí</option>
    </select>

    <script>
        function cambiar() {
            document.getElementById('texto').style.fontWeight =
                document.getElementById('negrita').value;

            document.getElementById('texto').style.fontStyle =
                document.getElementById('cursiva').value;
        }
    </script>
</body>
</html>
